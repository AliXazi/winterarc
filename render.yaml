services:
  - type: web
    name: winterarc
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false # set to Neon/Supabase URL in Render Dashboard -> Environment

# Free Postgres on Render expires after 90 days and burns 750h quota.
# Using Neon (free, no sleep) lets the web service stay up 31/31 days with the keep-alive pinger.
# databases: removed - use external Postgres instead
