services:
  - type: web
    name: winterarc
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: winterarc-db
          property: connectionString

databases:
  - name: winterarc-db
    plan: free
    databaseName: winterarc
    user: winterarc
